/**
 * Core layered telemetry v2 capture format.
 *
 * The core format is game-agnostic and carries timing/file structure.
 * Game-specific payloads are attached through oneof extension points.
 *
 * A capture stream consists of: one header, many frames, and one footer.
 */
syntax = "proto3";

package telemetry.v2;

import "google/protobuf/timestamp.proto";
import "telemetry/v2/echo_arena.proto";

option csharp_namespace = "Nevr.Telemetry.V2";
option go_package = "buf.build/gen/go/echotools/nevr-api/protocolbuffers/go/telemetry/v2;telemetryv2";
option java_multiple_files = true;
option java_outer_classname = "CaptureProto";
option java_package = "com.echotools.nevr.telemetry.v2";

/**
 * Streaming envelope for capture records.
 */
message Envelope {
  oneof message {
    CaptureHeader header = 1;
    Frame frame = 2;
    CaptureFooter footer = 3;
  }
}

/**
 * Session-scoped metadata written once at capture start.
 */
message CaptureHeader {
  // Unique identifier for the capture (UUID format recommended).
  string capture_id = 1;

  // Capture creation timestamp; frame timestamps are deltas from this base.
  google.protobuf.Timestamp created_at = 2;

  // Core capture format version. For this schema it must be 2.
  uint32 format_version = 3;

  // Format MINOR/PATCH (SemVer). MAJOR is format_version. A reader that
  // understands MAJOR=2 must read any 2.x file; unknown minors add only
  // optional fields. Absent (0) on pre-2.1 captures.
  uint32 format_minor = 5;
  uint32 format_patch = 6;

  // ------------------------------------------------------------------------
  // THE BREAKING-CHANGE LICENCE, AND ITS SCOPE. Read both halves or neither.
  // ------------------------------------------------------------------------
  //
  // Owner, 2026-09-07: "yeah, collapse matchType. definitely." and
  // "we arent breaking anything because we are working towards firming up the
  // proto." Earlier the same day: "we are not released yet. and the cost right
  // now is negligable vs running 60 servers streaming the data to nevr-stream."
  //
  // That is a real decision and the collapse above was made under it. It is
  // recorded here plainly, not as a hedge: three fields and eight enum values
  // were removed from a published schema on purpose, and it was right.
  //
  // THE CONDITION, WHICH IS NOT BACKGROUND. The licence is true BECAUSE nothing
  // we cannot re-cut consumes this schema at a pinned version yet. That
  // condition expires. The moment something does, the identical argument
  // INVERTS: a breaking commit stops being free and becomes a format-version
  // event. The decision was sound; the PRECEDENT is what needs bounding, and a
  // precedent quoted without its condition is how a licence outlives its reason.
  //
  // THE FALSIFIER, AND IT IS NOT WHAT ANYONE WILL REACH FOR FIRST.
  //
  // There is NO local instrument that proves this window is still open. That is
  // a finding, not an omission, and the obvious candidates were measured and
  // killed on 2026-09-07 so nobody re-derives them:
  //
  //   "the repo is untagged, so nothing is released"  -- FALSE HERE. This repo
  //     carries 11 tags through v4.5.0, and v4.5.0 IS commit 92bdd2f, the tip
  //     immediately before this work: 11 tags across 54 commits, roughly one in
  //     five. Tagging here is routine module versioning, not a release ceremony.
  //     Worse, the axes differ -- the repo tag major is 4 while this wire
  //     format_version is 2 -- so a tag says nothing about format stability.
  //
  //   "a consumer pins a published version, so it is released" -- FALSE. tape
  //     has always consumed nevr-api as a pinned BSR version; that is the only
  //     way buf distributes. By this test the window was NEVER open, which
  //     contradicts the owner directly. A test that says a window never opened
  //     cannot be the test for whether it has closed.
  //
  //   "some other repo carries a release tag" -- not checkable from here, and
  //     its subject set GROWS. A falsifier whose subject nobody can enumerate
  //     is not a falsifier.
  //
  // So the check is not on the world, it is ON THE CITER, and that is the only
  // version of it a stranger can actually run:
  //
  //   ANYONE INVOKING THIS LICENCE MUST CITE THE OWNER RULING THAT GRANTED IT
  //   AND ESTABLISH THAT IT IS STILL CURRENT. SILENCE IS EXPIRY, NOT EXTENSION.
  //
  // It is not self-renewing. If you are reading this and cannot establish that
  // nothing released now depends on this schema, IT DOES NOT APPLY -- ask. The
  // failure mode of every instrument above is that it fails OPEN, licensing a
  // break after the window shut; this one fails CLOSED, costing a question.
  //
  // Related and deliberately unanswered here: whether the removals above are a
  // 2.2.0, an amendment to 2.1.0, or a 3.0.0. Removing fields violates the
  // "unknown minors add only optional fields" contract stated four lines up, by
  // its own words. Nothing in this .proto sets format_minor -- the producer sets
  // it at runtime -- so there was nothing to change here, and picking a number
  // would be legislating. That is the owner's call.

  // Materialization of this capture's frames. UNSPECIFIED == SPARSE.
  FrameEncoding frame_encoding = 7;

  // The engine's own game-type symbol, verbatim: "echo_arena",
  // "echo_arena_private", "echo_combat", "echo_combat_private",
  // "echo_arena_tournament", and whatever the game adds next. Empty when the
  // producer observed none.
  //
  // DO NOT CONVERT THIS TO AN ENUM. The set is OPEN and it is the ENGINE'S, not
  // ours -- it grows whenever the game ships a mode, and we do not control when.
  // An enum is for a closed set you own. Modelling someone else's open set as an
  // enum makes every new mode a proto edit plus a BSR republish plus a go.mod
  // bump in every consumer, and until all of that lands the new mode decodes as
  // UNSPECIFIED and the value is GONE. As a string a new mode costs nothing and
  // round-trips exactly, forever.
  //
  // This is not a new decision here. nevr-common already ships the same shape:
  // `string mode = 1;` commented `// The game mode, e.g. "echo_arena_private"`,
  // paired with `string level = 2;`, in message LobbySessionCreateRequest
  // (nevr-common proto/api/v1/http_v1.proto:98-101 @ 4e367f3).
  //
  // Case is the producer's, not ours: the engine and the api/v1 `mode` field use
  // lowercase ("echo_arena_private"), while v1 echoreplay JSON captures use
  // Title_Case ("Echo_Arena_Private"). Both are stored verbatim. Anything
  // deriving meaning from this symbol must fold case; see the reserved block in
  // echo_arena.proto.
  string game_type = 8;

  // THE WHOLE PRODUCING STACK THAT MADE THIS CAPTURE, as a User-Agent string.
  // Empty on captures written before this field existed.
  //
  // GRAMMAR: space-separated `product/version` tokens, most significant first,
  // with an optional trailing parenthesised comment for things that are not
  // ours. Deliberately the boring RFC shape, because it is already understood
  // and already parseable.
  //
  //   nevr-runtime/2.4.1 nevr-sentinel/0.3.1 (echovr/1.9.9.1.62_r1)
  //   nevr-server-rs/1.0.0
  //
  // A STRING, NOT STRUCTURED FIELDS, AND IT IS THE SAME TEST AS game_type: the
  // value space changes under us, therefore string. Two reasons, and neither is
  // "fewer fields is tidier" -- write that down, because the next reader will
  // think they are simplifying:
  //
  //  (a) THE PARTS ARE NOT INDEPENDENT. nevr-runtime IS the mod, so a working
  //      runtime implies the binary underneath it. An engine sha1 as its own
  //      field was a DERIVED fact wearing the costume of a primary one, and a
  //      derived field is a second source of truth that can disagree with the
  //      thing it derives from -- the same defect that removed
  //      EchoArenaHeader.private_match.
  //
  //  (b) THE STACK IS BEING REPLACED, NOT VERSIONED. Owner, 2026-09-07: "going
  //      forward, it wont even be echovr.exe generating .tape, it will the fully
  //      custom nevr-server-rs." A structured field for a departing component
  //      becomes a permanently-empty entry on every future capture that every
  //      reader must then learn to ignore. A string simply stops mentioning an
  //      engine. THAT ASYMMETRY IS THE ARGUMENT: a field cannot be un-added, but
  //      a segment can be un-emitted.
  //
  // It distinguishes producer GENERATIONS, not merely versions, and that is the
  // job it exists for. nevr-agent polls the engine's HTTP JSON endpoint and is
  // deprecated; a direct engine-memory reader replaces it, and nevr-server-rs
  // replaces the engine itself. After each cutover nothing else in the file says
  // what wrote a given capture, and it cannot be established retroactively.
  //
  // It has a reader, not only a writer. Producer-generation quirks are already
  // documented in this schema and a converter has to key on them: see
  // PlayerInfoUpdated in echo_arena.proto, where the engine reports
  // jersey_number and level as 0 for roughly the first two frames after a join
  // (measured on frames 243-244 of a 12,815-frame capture). Whether such a quirk
  // applies is a property of the producer, and this is the only field naming it.
  //
  // IF A SHA APPEARS IN A COMMENT SEGMENT, WRITE IT AS LOWERCASE HEX. This is
  // ADVICE AND IT WAS BRIEFLY A CONTRACT: fields `engine_version = 101` and
  // `engine_sha1 = 102` existed here on 2026-09-07 and were removed the same day
  // under (a) and (b) above. The lowercase rule was a field contract then and is
  // only a convention now -- NOTHING PARSES OR ENFORCES IT, and the demotion is
  // stated so a later reader does not mistake advice for a guarantee.
  //
  // The reasoning survives the demotion because it was never about sha1: this
  // schema already carries a fact spelled two ways by two producers -- game_type,
  // lowercase from the engine and Title_Case from v1 echoreplay -- and an
  // unfolded comparison gets the wrong answer WITHOUT ERRORING. Anything
  // comparing a value out of this string should fold case.
  //
  // Field numbers 101 and 102 are FREE, not reserved. Reservation protects old
  // BYTES from being reinterpreted, and no bytes were ever published carrying
  // them: they existed only in local commits on this machine and nothing was
  // pushed, so there is nothing to protect. Reserving them would cost two
  // numbers to guard a capture that does not exist.
  string producer = 9;

  // Arbitrary metadata (game version, server IP, recorder build, etc).
  map<string, string> metadata = 4;

  // Game-specific header payloads.
  oneof game_header {
    EchoArenaHeader echo_arena = 10;
    // Future game headers: 11-99
  }

  // Core (non-game) header fields continue at 100+, deliberately ABOVE the
  // game_header oneof rather than eating into it.
  //
  // THE ONEOF'S TERRITORY IS 10-99, NOT 11-99. Field 10 is `echo_arena`, the
  // member that already exists; 11-99 is the earmark for the members that do
  // not exist yet. An earlier version of this comment said "the 11-99
  // game_header band", which is true of the FREE numbers and reads as though 10
  // were available -- a reader taking a stand-in number from just below the band
  // collides with echo_arena. Corrected 2026-09-07 after tape-foreman was nearly
  // caught by exactly that inference; a wire number is expensive to take back.
  //
  // A scalar dropped anywhere in 10-99 reads to the next author as oneof
  // territory, and the range has to stay whole for as long as the oneof can
  // grow. The only cost of a field number above 15 is one extra tag byte, paid
  // once per capture -- nothing, by the rule stated on Frame.is_keyframe.

  // SHA-256 of the zstd compression dictionary used to write this capture's
  // frames. Empty when no dictionary was used.
  //
  // This field exists because a WRONG dictionary carrying a COLLIDING id returns
  // wrong telemetry with no error whatsoever. Measured over 10 A/B dictionary
  // pairs x 200 float-heavy frames: 2200 frames returned WITHOUT ERROR, 633 of
  // them with WRONG CONTENT -- e.g. frame 0, player 1, truth z=-28.307524, read
  // z=-7.076881. A MISSING dictionary does fail loudly ("unknown dictionary");
  // a wrong one does not, because the id is caller-chosen and nothing anywhere
  // compares dictionary CONTENT. Two operators both starting at the documented
  // MinPrivateDictionaryID of 32768, or a single retrain under a reused id,
  // collide with nothing to detect it.
  // [spritz findings/2026-09-05-tape-bughunt-fable.md F3]
  //
  // The reader's obligation, which is the whole point: on open, hash the
  // dictionary it resolved and compare. A mismatch is a hard error. An empty
  // value asserts NOTHING and must never be read as agreement.
  //
  // The algorithm is in the field name rather than in a companion `algo` enum
  // on purpose: a future algorithm takes its own field number, which cannot be
  // misread, whereas a discriminator can be ignored by a reader that assumes.
  bytes dictionary_sha256 = 100;

  // 900-999 ARE RESERVED AND MUST NEVER BE ASSIGNED. They are not a future
  // range; they are a permanently empty one, and that is their entire purpose.
  //
  // A test that proves this header is extensible has to build wire bytes at
  // field numbers the schema does not define (tape
  // pkg/codec/header_extensibility_test.go). If it borrows whatever numbers
  // happen to be free, it is correct only until someone assigns them -- and on
  // that day the test does not fail, it keeps passing while quietly testing
  // nothing, because the stand-in becomes a known field that round-trips. That
  // already happened once here: `producer = 9` landed on a stand-in and turned a
  // preservation test into a round-trip test that stayed green.
  //
  // Reserving a range protoc will refuse to anyone makes the test's premise true
  // by construction instead of by vigilance. Nobody has to remember why.
  reserved 900 to 999;
}

/**
 * Per-frame timing envelope.
 *
 * Core frame overhead is intentionally minimal (two varints + oneof tag).
 */
message Frame {
  // Sequential frame index, 0-based.
  uint32 frame_index = 1;

  // Milliseconds since CaptureHeader.created_at.
  // Max duration: ~49.7 days (uint32 overflow). Sufficient for game sessions.
  uint32 timestamp_offset_ms = 2;

  // True on a frame that is self-contained and therefore safe to seek to or
  // start reading from. Absent (false) on every other frame.
  //
  // CaptureFooter.keyframe_index already answers this for a FINISHED FILE. It
  // cannot answer it for a LIVE STREAM: the footer is by definition the last
  // record written, so a consumer reading a session still in progress -- which
  // is the entire nevr-stream case, servers streaming continuously -- has no
  // index at all and no other way to know where it may begin.
  //
  // Cost: free twice over. proto3 writes nothing for a false bool, so every
  // non-keyframe pays exactly zero bytes; and where it is true it is two bytes
  // of near-zero entropy through the trained zstd dictionary.
  //
  // WHAT A PER-FRAME FIELD ACTUALLY COSTS. Recorded here because this is where
  // it was decided, and stated carefully because TWO EARLIER VERSIONS OF THIS
  // RULE WERE WRONG IN THE SAME DIRECTION: both priced the WIRE.
  //
  //   superseded: (width) x (frame rate)
  //   superseded: (fraction of frames non-default) x (compressed entropy)
  //
  // The second is closer and still prices the wrong resource. The stated
  // constraint is ENCODE CPU ON A MACHINE THAT IS ALSO RUNNING A GAME, and that
  // is not proportional to bytes on the wire -- it is proportional to proto
  // marshalling and zstd block flushes. A per-frame field that NEVER CHANGES
  // still costs a marshal on every single frame while adding almost nothing to
  // the wire after dictionary compression, and that cost is INVISIBLE to any
  // bytes-per-second metric.
  //
  // So the question to ask of a proposed per-frame field is not "how many
  // bytes" but: DOES THIS CHANGE BETWEEN FRAMES? The evidence is a change-rate
  // census (tape pkg/conversion/change_rate_census_bench_test.go @ c453ef7),
  // not a byte count. This schema already argues that way where it has the
  // measurement: possession_time rides the frame at 29.4 changes per 100 frames
  // while the eleven integer counters beside it move 0.6 times per 100 frames
  // and ride an event instead (echo_arena.proto, PlayerState.possession_time).
  //
  // DO NOT PRICE ANYTHING HERE OFF A FRAME RATE. The production capture rate is
  // UNMEASURED as of 2026-09-07. The figures in circulation are a ceiling and a
  // rig: "up to 60 Hz" (all-the-way-down projects/nevr-stream.md:25) is a
  // MAXIMUM, not a rate; tape's frame processor is documented for "up to 600 Hz"
  // (tape pkg/processing/frame_processor.go:14 @ c453ef7); and the only capture
  // on hand measured about 2 fps but was written by a container rig that may be
  // throttled. That spread is ~300x and no production server has been measured.
  //
  // is_keyframe passes the change test at ANY rate in that range, and not by
  // luck: it does not vary with game state at all, it is a deterministic
  // function of the frame index -- tape emits one every DefaultKeyframeInterval
  // = 100 frames, counted in FRAMES and not seconds (tape pkg/codec/tape.go:19
  // and :205 @ c453ef7, `frameIndex%w.keyframeInterval == 0`), so the fraction
  // is rate-independent. 99 frames in 100 pay exactly zero, at 2 fps and at 600.
  //
  // A HEADER field, by contrast, is written once per capture -- and under the
  // per-block default it is its own block, so growing it recompresses one small
  // block and touches nothing else. Decide those on clarity, not bytes.
  bool is_keyframe = 3;

  // Game-specific frame payloads.
  oneof payload {
    EchoArenaFrame echo_arena = 10;
    // Future game payloads: 11-99
    // Non-game payloads (annotations, debug): 100-199
  }
}

/**
 * Capture summary and trailing indexes for efficient seeking.
 * Written as the final Envelope in a capture stream/file.
 */
message CaptureFooter {
  // Total number of frames written.
  uint32 frame_count = 1;

  // Total capture duration in milliseconds.
  uint32 duration_ms = 2;

  // Byte offset from file start where this footer begins.
  // Readers can seek to this offset to read the footer directly.
  uint64 footer_offset = 3;

  // Keyframe index for time-based seek.
  // Each entry points to a self-contained frame suitable for random access.
  repeated KeyframeEntry keyframe_index = 4;

  // Event index for type-based seek.
  repeated EventIndexEntry event_index = 5;
}

/**
 * Byte offset for a seekable keyframe.
 * byte_offset points to the first byte of the length-delimited Envelope
 * record containing this frame.
 */
message KeyframeEntry {
  uint32 frame_index = 1;
  uint64 byte_offset = 2;
}

/**
 * Mapping from event type to frames that contain it.
 */
message EventIndexEntry {
  EventType event_type = 1;
  repeated uint32 frame_indices = 2;
}

/**
 * Enumeration of all known event types for the event index.
 */
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;

  // Game state events
  EVENT_TYPE_ROUND_STARTED = 1;
  EVENT_TYPE_ROUND_PAUSED = 2;
  EVENT_TYPE_ROUND_UNPAUSED = 3;
  EVENT_TYPE_ROUND_ENDED = 4;
  EVENT_TYPE_MATCH_ENDED = 5;
  EVENT_TYPE_SCOREBOARD_UPDATED = 6;

  // Player events
  EVENT_TYPE_PLAYER_JOINED = 10;
  EVENT_TYPE_PLAYER_LEFT = 11;
  EVENT_TYPE_PLAYER_SWITCHED_TEAM = 12;
  EVENT_TYPE_EMOTE_PLAYED = 13;

  // EchoEvent defines loadout_changed and grab_changed but this enum had no
  // value for either, so a writer that indexes events by type dropped them
  // from CaptureFooter.event_index entirely and no index scan could find them.
  EVENT_TYPE_LOADOUT_CHANGED = 14;
  EVENT_TYPE_GRAB_CHANGED = 15;
  EVENT_TYPE_PLAYER_INFO_UPDATED = 16;

  // Disc events
  EVENT_TYPE_DISC_POSSESSION_CHANGED = 20;
  EVENT_TYPE_DISC_THROWN = 21;
  EVENT_TYPE_DISC_CAUGHT = 22;

  // Scoring events
  EVENT_TYPE_GOAL_SCORED = 30;
  EVENT_TYPE_PLAYER_GOAL = 31;

  // Stat events
  EVENT_TYPE_PLAYER_SAVE = 40;
  EVENT_TYPE_PLAYER_STUN = 41;
  EVENT_TYPE_PLAYER_PASS = 42;
  EVENT_TYPE_PLAYER_STEAL = 43;
  EVENT_TYPE_PLAYER_BLOCK = 44;
  EVENT_TYPE_PLAYER_INTERCEPTION = 45;
  EVENT_TYPE_PLAYER_ASSIST = 46;
  EVENT_TYPE_PLAYER_SHOT_TAKEN = 47;
  EVENT_TYPE_PLAYER_STATS_UPDATED = 48;

  // Misc
  EVENT_TYPE_GENERIC = 50;
}

// How each Frame's game payload is materialized. UNSPECIFIED is read as SPARSE
// (pre-2.1 captures have no field set), so sparse is the safe zero behavior.
// SPARSE = event-sourced (identity/loadout/scores reconstructed by replay);
// DENSE = every field materialized per frame (Frame.payload = echo_arena_dense).
//
// CORRECTED 2026-09-07: the line directly above names `echo_arena_dense`, and
// NO SUCH FIELD EXISTS. Frame.payload has exactly one member, `echo_arena = 10`;
// `echo_arena_dense` occurs nowhere in this module except in that sentence. So
// FRAME_ENCODING_DENSE is currently UNIMPLEMENTABLE: it is a documented reader
// for a writer that was never built. A writer setting DENSE today would be
// making a claim no field can carry, and a reader branching on DENSE has nothing
// to branch to.
//
// The stale sentence is left standing rather than rewritten so the defect stays
// visible. The value is NOT removed and NOT renumbered -- renumbering a
// published enum is a wire break, by this schema's own rule at GoalType above.
// Deciding what DENSE should actually mean is an open design question and is
// deliberately not answered here.
enum FrameEncoding {
  FRAME_ENCODING_UNSPECIFIED = 0;
  FRAME_ENCODING_SPARSE = 1;
  FRAME_ENCODING_DENSE = 2;
}
