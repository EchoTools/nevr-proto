/**
 * Echo Arena-specific payload definitions for telemetry v2.
 *
 * All Echo Arena game state, events, and player data live here.
 * No imports from telemetry/v1 or apigame/v1 — clean v2 break.
 */
syntax = "proto3";

package telemetry.v2;

import "spatial/v1/types.proto";

option csharp_namespace = "Nevr.Telemetry.V2";
option go_package = "buf.build/gen/go/echotools/nevr-api/protocolbuffers/go/telemetry/v2;telemetryv2";
option java_multiple_files = true;
option java_outer_classname = "EchoArenaProto";
option java_package = "com.echotools.nevr.telemetry.v2";

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

enum GameStatus {
  GAME_STATUS_UNSPECIFIED = 0;
  GAME_STATUS_PRE_MATCH = 1;
  GAME_STATUS_ROUND_START = 2;
  GAME_STATUS_PLAYING = 3;
  GAME_STATUS_SCORE = 4;
  GAME_STATUS_ROUND_OVER = 5;
  GAME_STATUS_POST_MATCH = 6;
  GAME_STATUS_PRE_SUDDEN_DEATH = 7;
  GAME_STATUS_SUDDEN_DEATH = 8;
  GAME_STATUS_POST_SUDDEN_DEATH = 9;
}

enum MatchType {
  MATCH_TYPE_UNSPECIFIED = 0;
  MATCH_TYPE_SOCIAL_PUBLIC = 1;
  MATCH_TYPE_SOCIAL_PRIVATE = 2;
  MATCH_TYPE_ARENA = 3;
  MATCH_TYPE_COMBAT = 4;
  MATCH_TYPE_ECHO_PASS = 5;
  MATCH_TYPE_FFA = 6;
  MATCH_TYPE_PRIVATE = 7;
  MATCH_TYPE_TOURNAMENT = 8;
}

enum PauseState {
  PAUSE_STATE_UNSPECIFIED = 0;
  PAUSE_STATE_NOT_PAUSED = 1;
  PAUSE_STATE_PAUSED = 2;
  PAUSE_STATE_UNPAUSING = 3;
  PAUSE_STATE_AUTOPAUSE_REPLAY = 4;

  // The engine emits "none" and "unpaused" as distinct strings and both were
  // previously narrowed to NOT_PAUSED; "paused_requested" was narrowed to
  // PAUSED. Both narrowings lost information the round-trip could not recover.
  // "none" is observed in sampled captures.
  PAUSE_STATE_NONE = 5;
  PAUSE_STATE_PAUSED_REQUESTED = 6;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_BLUE_TEAM = 1;
  ROLE_ORANGE_TEAM = 2;
  ROLE_SPECTATOR = 3;
  ROLE_SOCIAL_PARTICIPANT = 4;
  ROLE_MODERATOR = 5;
}

enum GoalType {
  GOAL_TYPE_UNSPECIFIED = 0;
  GOAL_TYPE_INSIDE_SHOT = 1;
  GOAL_TYPE_LONG_SHOT = 2;
  GOAL_TYPE_BOUNCE_SHOT = 3;
  GOAL_TYPE_LONG_BOUNCE_SHOT = 4;
  GOAL_TYPE_SELF_GOAL = 5;
}

// ---------------------------------------------------------------------------
// Session Header
// ---------------------------------------------------------------------------

/**
 * Echo Arena session metadata, written once at capture start.
 */
message EchoArenaHeader {
  string session_id = 1;
  string map_name = 2;
  MatchType match_type = 3;
  string client_name = 4;
  bool private_match = 5;
  bool tournament_match = 6;
  int32 total_round_count = 7;
  repeated PlayerInfo initial_roster = 8;

  // Default skeleton layout for all players. Individual players can
  // override via PlayerBones.skeleton_override.
  SkeletonLayout skeleton = 9;

  // Session server IP (session constant; written once).
  string session_ip = 10;

  // Who last changed the match rules, and when (engine `rules_changed_by` /
  // `rules_changed_at`). Session-constant: measured invariant across every
  // frame of 15 sampled captures. Commonly the literal "[INVALID]".
  string rules_changed_by = 11;
  uint64 rules_changed_at = 12;

  // Team display names, indexed by team (0 blue, 1 orange, 2 spectator).
  //
  // Not derivable from Role: private and tournament matches carry custom names
  // (a sampled capture used "Raptured and Friend" for team 0 across 887
  // frames). Constant within a capture — measured invariant in 25/25 sampled
  // captures — so it is written once here rather than per frame.
  repeated string team_names = 13;
}

/**
 * Skeleton memory layout contract for zero-copy bone data.
 */
message SkeletonLayout {
  uint32 bone_count = 1;
  // Bytes per bone transform (default: 12 = 3 × float32).
  uint32 transform_stride = 2;
  // Bytes per bone orientation (default: 16 = 4 × float32 quaternion).
  uint32 orientation_stride = 3;
}

/**
 * Stable roster entry for a player in the session.
 */
message PlayerInfo {
  int32 slot = 1;
  uint64 account_number = 2;
  string display_name = 3;
  Role role = 4;
  // Player's jersey number (session constant).
  int32 jersey_number = 5;
  // Player's XP level (session constant).
  int32 level = 6;
}

// ---------------------------------------------------------------------------
// Per-Frame Game State
// ---------------------------------------------------------------------------

/**
 * Echo Arena per-frame game state snapshot.
 *
 * Frames are self-contained for random access: scores and round number
 * are repeated in every frame even when unchanged (~6-9 bytes overhead).
 */
message EchoArenaFrame {
  GameStatus game_status = 1;
  float game_clock = 2;
  PauseState pause_state = 3;
  DiscState disc = 4;
  repeated PlayerState players = 5;
  repeated PlayerBones player_bones = 6;

  // Slot of the player holding the disc. Absent when disc is free.
  optional int32 disc_holder_slot = 7;

  // VR tracking origin of the capture client (not available for remote players).
  spatial.v1.Pose vr_root = 8;

  // Current scores (repeated per frame for random access).
  int32 blue_points = 9;
  int32 orange_points = 10;
  int32 round_number = 11;

  // Events that occurred during this frame.
  repeated EchoEvent events = 12;

  // Echo Combat payload state. Absent entirely in arena matches.
  optional PayloadState payload = 13;

  // Raw analog shoulder (trigger/grip) input of the *capture client* — primary
  // + alternate, per hand. Session-level like vr_root: only the recording
  // client's own input exists, not remote players'. 0.0 when not pressed (free
  // on the wire).
  float left_shoulder_pressed = 14;
  float right_shoulder_pressed = 15;
  float left_shoulder_pressed_2 = 16;
  float right_shoulder_pressed_2 = 17;

  // Engine `err_code` and the per-team restart-request flags. Measured 0 on
  // every frame of every sampled capture, but they are transient request flags
  // rather than session constants, so they live per-frame: proto3 writes
  // nothing for a zero value, making an always-zero field free on the wire
  // while still round-tripping exactly if it ever toggles.
  int32 err_code = 18;
  int32 blue_team_restart_request = 19;
  int32 orange_team_restart_request = 20;

  // Pause sub-state beyond the `pause_state` enum above. Present only while a
  // pause is in progress, so nil on virtually every frame.
  optional PauseDetail pause_detail = 21;
}

// PauseDetail carries the engine PauseState fields that the per-frame
// `pause_state` enum cannot express: which team is involved and the two
// countdown timers. Measured to vary in 1-2 of 15 sampled captures — rare, but
// the timers tick per-frame while a pause resolves, so this rides the frame
// rather than an event.
message PauseDetail {
  Role unpaused_team = 1;
  Role paused_requested_team = 2;
  float unpaused_timer = 3;
  float paused_timer = 4;
}

/**
 * Disc state snapshot.
 */
message DiscState {
  spatial.v1.Pose pose = 1;
  spatial.v1.Vec3 velocity = 2;
  uint32 bounce_count = 3;
}

/**
 * Echo Combat payload state. Only present on EchoArenaFrame in combat/payload
 * matches — absent entirely (zero wire cost) in arena.
 */
message PayloadState {
  float multiplier = 1;
  int32 checkpoint = 2;
  float distance = 3;
  int32 defenders = 4;
  float speed = 5;
}

/**
 * Player transform and status snapshot.
 */
message PlayerState {
  int32 slot = 1;
  spatial.v1.Pose head = 2;
  spatial.v1.Pose body = 3;
  spatial.v1.Pose left_hand = 4;
  spatial.v1.Pose right_hand = 5;
  spatial.v1.Vec3 velocity = 6;

  // Packed boolean flags + team index:
  //   bit 0: stunned
  //   bit 1: invulnerable
  //   bit 2: blocking
  //   bit 3: possession
  //   bit 4: is_emote_playing
  //   bits 5-6: team index (0=blue, 1=orange, 2=spectator) — REQUIRED for
  //             team reconstruction; a writer that leaves these zero collapses
  //             all players onto the blue team. See tape mapping.go mapPlayers
  //             / reconstruct.go reconstructTeams.
  //   bits 7-31: reserved
  uint32 flags = 7;

  // Network latency in milliseconds.
  uint32 ping = 8;

  // Per-frame network packet-loss ratio for this player (0.0 when none).
  float packet_loss_ratio = 9;

  // Cumulative seconds this player has held the disc, as the engine reports it
  // (engine `stats.possession_time`).
  //
  // Per-frame rather than event-carried: measured 29.4 changes per 100 frames
  // across 25 sampled captures, because it ticks continuously while a player
  // holds the disc. The eleven integer counters in the same engine stats block
  // move only 0.6 times per 100 frames and ride PlayerStatsUpdated instead.
  //
  // This is the engine's own value, which includes a pre-capture baseline (a
  // sampled capture opened at 13.22s) and therefore cannot be reconstructed by
  // accumulating detected events from frame 0.
  float possession_time = 10;
}

/**
 * Zero-copy player bone payload.
 *
 * transforms and orientations are little-endian float32 byte arrays
 * matching the C++ in-memory layout. See SkeletonLayout for dimensions.
 *
 * Default layout (22 bones):
 *   transforms:   22 × 3 × float32 = 264 bytes
 *   orientations: 22 × 4 × float32 = 352 bytes
 */
message PlayerBones {
  int32 slot = 1;
  bytes transforms = 2;
  bytes orientations = 3;
  // Override skeleton layout if this player differs from the header default.
  optional SkeletonLayout skeleton_override = 4;
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------

/**
 * Wrapper for all Echo Arena events.
 * Field number ranges: 10-19 game state, 20-29 player, 30-39 disc,
 * 40-49 scoring, 50-59 stats, 60-69 misc.
 */
message EchoEvent {
  oneof event {
    // Game state events (10-19)
    RoundStarted round_started = 10;
    RoundPaused round_paused = 11;
    RoundUnpaused round_unpaused = 12;
    RoundEnded round_ended = 13;
    MatchEnded match_ended = 14;
    ScoreboardUpdated scoreboard_updated = 15;

    // Player events (20-29)
    PlayerJoined player_joined = 20;
    PlayerLeft player_left = 21;
    PlayerSwitchedTeam player_switched_team = 22;
    EmotePlayed emote_played = 23;
    LoadoutChanged loadout_changed = 24;
    GrabChanged grab_changed = 25;

    // Disc events (30-39)
    DiscPossessionChanged disc_possession_changed = 30;
    DiscThrown disc_thrown = 31;
    DiscCaught disc_caught = 32;

    // Scoring events (40-49)
    GoalScored goal_scored = 40;
    PlayerGoal player_goal = 41;

    // Stat events (50-59)
    PlayerSave player_save = 50;
    PlayerStun player_stun = 51;
    PlayerPass player_pass = 52;
    PlayerSteal player_steal = 53;
    PlayerBlock player_block = 54;
    PlayerInterception player_interception = 55;
    PlayerAssist player_assist = 56;
    PlayerShotTaken player_shot_taken = 57;
    PlayerStatsUpdated player_stats_updated = 58;

    // Misc events (60-69)
    GenericEvent generic_event = 60;
  }
}

// Game state events --------------------------------------------------------

message RoundStarted {
  int32 round_number = 1;
}

message RoundPaused {
  PauseState pause_state = 1;
  // Team that requested the pause.
  Role requesting_team = 2;
  // Pause timer value in seconds at time of event.
  float pause_timer = 3;
}

message RoundUnpaused {
  PauseState pause_state = 1;
}

message RoundEnded {
  int32 round_number = 1;
  Role winning_team = 2;
}

message MatchEnded {
  Role winning_team = 1;
}

message ScoreboardUpdated {
  int32 blue_points = 1;
  int32 orange_points = 2;
  int32 blue_round_score = 3;
  int32 orange_round_score = 4;
  // Display-formatted game clock (e.g., "04:32.1", "OT 1:23").
  string game_clock_display = 5;
}

// Player events ------------------------------------------------------------

message PlayerJoined {
  int32 slot = 1;
  uint64 account_number = 2;
  string display_name = 3;
  Role role = 4;
  int32 jersey_number = 5;
  int32 level = 6;
}

message PlayerLeft {
  int32 player_slot = 1;
  string display_name = 2;
}

message PlayerSwitchedTeam {
  int32 player_slot = 1;
  Role new_role = 2;
  Role prev_role = 3;
}

message EmotePlayed {
  enum EmoteType {
    EMOTE_TYPE_UNSPECIFIED = 0;
    EMOTE_TYPE_PRIMARY = 1;
    EMOTE_TYPE_SECONDARY = 2;
  }
  int32 player_slot = 1;
  EmoteType emote = 2;
}

// Loadout (weapon/ordnance/tac-mod) changes rarely — on spawn or pickup — so
// it is event-driven, not a per-frame field. Seeded for every player at frame
// 0; reconstruct the per-frame loadout by replaying these via the Session layer
// (same pattern as the roster). Empty strings in arena (no combat loadout).
message LoadoutChanged {
  int32 player_slot = 1;
  string weapon = 2;
  string ordnance = 3;
  string tac_mod = 4;
}

// Grab state (what each hand is holding) changes occasionally during play, so
// it is event-driven, not per-frame. Seeded at frame 0; reconstruct per-frame
// via the Session layer. Empty string = holding nothing in that hand.
message GrabChanged {
  int32 player_slot = 1;
  string left_holding = 2;
  string right_holding = 3;
}

// Disc events --------------------------------------------------------------

message DiscPossessionChanged {
  // Slot of the player who now has possession. Absent if disc is free.
  optional int32 player_slot = 1;
  // Slot of the player who previously had possession. Absent if disc was free.
  optional int32 previous_player_slot = 2;
}

message DiscThrown {
  int32 player_slot = 1;
  ThrowDetails throw_details = 2;
}

message ThrowDetails {
  float arm_speed = 1;
  float total_speed = 2;
  float off_axis_spin_deg = 3;
  float wrist_throw_penalty = 4;
  float rot_per_sec = 5;
  float pot_speed_from_rot = 6;
  float speed_from_arm = 7;
  float speed_from_movement = 8;
  float speed_from_wrist = 9;
  float wrist_align_to_throw_deg = 10;
  float throw_align_to_movement_deg = 11;
  float off_axis_penalty = 12;
  float throw_move_penalty = 13;
}

message DiscCaught {
  int32 player_slot = 1;
}

// Scoring events -----------------------------------------------------------

message GoalScored {
  float disc_speed = 1;
  Role team = 2;
  GoalType goal_type = 3;
  int32 point_amount = 4;
  float distance_thrown = 5;
  int32 scorer_slot = 6;
  // Slot of the assisting player. Absent if no assist.
  optional int32 assist_slot = 7;
  // Scorer / assister display names from the engine (v1 LastScore). Empty when
  // unknown. Authoritative scorer IDENTITY at the GoalScored level: prefer a
  // non-empty person_scored over scorer_slot, which is 0 both for "slot 0" and
  // "unresolved" (the real scorer slot rides the parallel PlayerGoal event).
  string person_scored = 8;
  string assist_scored = 9;
}

message PlayerGoal {
  int32 player_slot = 1;
  int32 total_goals = 2;
  int32 points = 3;
}

// Stat events --------------------------------------------------------------

message PlayerSave {
  int32 player_slot = 1;
  int32 total_saves = 2;
}

message PlayerStun {
  int32 player_slot = 1;
  int32 total_stuns = 2;
}

message PlayerPass {
  int32 player_slot = 1;
  int32 total_passes = 2;
}

message PlayerSteal {
  int32 player_slot = 1;
  int32 total_steals = 2;
  // Slot of the player who had possession. Absent if unknown.
  optional int32 victim_player_slot = 3;
}

message PlayerBlock {
  int32 player_slot = 1;
  int32 total_blocks = 2;
}

message PlayerInterception {
  int32 player_slot = 1;
  int32 total_interceptions = 2;
}

message PlayerAssist {
  int32 player_slot = 1;
  int32 total_assists = 2;
}

message PlayerShotTaken {
  int32 player_slot = 1;
  int32 total_shots = 2;
}

// PlayerStatsUpdated carries the engine's own per-player stat block whenever any
// of its integer counters changes.
//
// This is deliberately NOT the same data as the PlayerGoal/PlayerSave/… events
// above, which are emitted by tape's own sensors. Measured on a real capture,
// the two disagree: the engine reported 0 stuns and 0 catches for a player over
// a whole match while the sensors emitted 3 and 5. The engine's counters also
// carry a pre-capture baseline, so they cannot be rebuilt by accumulating
// detected events. Round-tripping `stats` requires the engine's numbers.
//
// Placed as an event because the integer counters move only 0.6 times per 100
// frames (25 sampled captures). The twelfth stats field, possession_time, ticks
// ~29.4 times per 100 frames and lives on PlayerState instead.
message PlayerStatsUpdated {
  int32 player_slot = 1;
  int32 points = 2;
  int32 saves = 3;
  int32 goals = 4;
  int32 stuns = 5;
  int32 passes = 6;
  int32 catches = 7;
  int32 steals = 8;
  int32 blocks = 9;
  int32 interceptions = 10;
  int32 assists = 11;
  int32 shots_taken = 12;
}

// Misc events --------------------------------------------------------------

message GenericEvent {
  string event_type = 1;
  map<string, string> data = 2;
  string payload = 3;
}
