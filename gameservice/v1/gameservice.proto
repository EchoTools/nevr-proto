// ============================================================================
// Early Quit Penalty System Messages
// ============================================================================

// Remove ("smite") a player from a lobby session. Sent from service to game
// server, which re-encodes as a 0x10-byte binary message and injects via
// BroadcasterReceiveLocalEvent. HOST_ONLY (handler flags 0x04).
//
// Binary wire format (game engine):
//   +0x00  uint64  player_id
//   +0x08  uint64  reserved (zero)
message SNSLobbySmiteEntrantMessage {
  // The entrant to remove from the lobby, as a UUID string.
  string entrant_id = 1;
  // The lobby session the entrant should be removed from.
  string lobby_session_id = 2;
}

// Early quit penalty tier configuration. Sent from service to game server on
// player login, which re-encodes as a 0x40-byte binary header + zlib-compressed
// JSON payload and injects via BroadcasterReceiveLocalEvent.
//
// Binary wire format (game engine):
//   +0x00  uint32  config_version
//   +0x04  uint32  num_penalty_levels
//   +0x08  uint32  num_steady_levels
//   +0x0C  uint32  flags
//   +0x10  uint64  timestamp
//   +0x18  uint64  data_offset
//   +0x20  uint32  data_length
//   +0x24  uint32  checksum
//   +0x28  [24]    reserved
//   +0x40  []byte  zlib-compressed JSON {"penalty_levels":[...],"steady_player_levels":[...]}
message SNSEarlyQuitConfigMessage {
  uint32 config_version = 1;
  repeated EarlyQuitPenaltyLevel penalty_levels = 2;
  repeated EarlyQuitSteadyPlayerLevel steady_player_levels = 3;
  uint32 flags = 4;
}

// A single penalty tier in the early quit system.
message EarlyQuitPenaltyLevel {
  int32 penalty_level = 1;
  int32 min_earlyquits = 2;
  int32 max_earlyquits = 3;
  int32 mm_lockout_sec = 4;
  int32 spawnlock = 5;
  int32 autoreport = 6;
  int32 cnvpe_reactivated = 7;
}

// A single steady player tier in the early quit system.
message EarlyQuitSteadyPlayerLevel {
  int32 steady_player_level = 1;
  int32 min_num_matches = 2;
  float min_steady_ratio = 3;
}

// Early quit feature flags. Sent from service to game server on player login.
// Re-encoded as a 0x08-byte binary struct.
//
// Binary wire format (game engine):
//   +0x00  uint32  flags (bitfield: bit0=enabled, bit1=steady_tracking,
//                         bit2=penalty_enforcement, bit3=auto_report)
//   +0x04  uint32  reserved
message SNSEarlyQuitFeatureFlagsMessage {
  uint32 flags = 1;
}

// Notify a player of their early quit penalty state. Sent from service to
// player via CTcpBroadcaster (TCP server connection).
//
// Binary wire format (0x38 bytes, confirmed via CTcpBroadcaster::Listen):
//   +0x00  UUID    login_session   (16B, not read by handler)
//   +0x10  uint64  player_id       (8B, not read by handler)
//   +0x18  int64   penalty_expiry  (8B, unix seconds — compared against stored)
//   +0x20  uint64  reserved        (8B, not read by handler)
//   +0x28  int32   num_early_quits (4B, stored to game state)
//   +0x2C  int32   penalty_level   (4B, stored to game state)
//   +0x30  int32   field_30        (4B, stored to game state)
//   +0x34  uint8   field_34        (1B, stored to game state)
//   +0x35  uint8   field_35        (1B, stored to game state)
//   +0x36  [2]byte padding
//
// Handler: CR15NetGame::EarlyQuitUpdateCB (Quest 0x136ac50)
message SNSEarlyQuitUpdateNotificationMessage {
  string entrant_id = 1;
  int32 num_early_quits = 2;
  int32 penalty_level = 3;
  uint64 penalty_expiry = 4;
}

// Lobby status notification. Sent from service directly to player via
// CTcpBroadcaster (TCP server connection) to notify of kick/ban/demote.
// Displays a message to the player in the game UI via the lobby status
// script expression (CR15NetLobbyStatusExpression).
//
// Binary wire format (0x60 bytes, confirmed via CTcpBroadcaster::Listen):
//   +0x00  UUID    channel         (16B, matched against lobby login_id)
//   +0x10  [64]    message         (64B UTF-8, displayed to player)
//   +0x50  int64   expiry_time     (8B, unix timestamp)
//   +0x58  uint64  reason          (8B, 0=banned, 1=kicked, 2=demoted)
//
// Handler: CR15NetGame::LobbyStatusNotifyCB (Quest 0x135f9cc)
message SNSLobbyStatusNotifyV2Message {
  // The lobby/channel this notification applies to.
  string channel = 1;
  // A message displayed to the player (max 64 bytes UTF-8).
  string message = 2;
  // Unix timestamp when the status change expires.
  int64 expiry_time = 3;

  enum Reason {
    REASON_BANNED_UNSPECIFIED = 0;
    REASON_KICKED = 1;
    REASON_DEMOTED = 2;
  }
  // The reason for the status notification.
  Reason reason = 4;
}

