// Bot difficulty levels.
// Source: nakama server/evr/gameserver_spawn_bot.go
enum BotDifficulty {
  BOT_DIFFICULTY_BEGINNER_UNSPECIFIED = 0;
  BOT_DIFFICULTY_INTERMEDIATE = 1;
  BOT_DIFFICULTY_ADVANCED = 2;
  BOT_DIFFICULTY_EXPERT = 3;
  BOT_DIFFICULTY_MASTER = 4;
}

// Instruct the game server to spawn bots.
// Sent from service to game server only.
//
// Binary wire format (48 bytes):
//   +0x00  uint32  message_type       (unused)
//   +0x04  uint32  match_id
//   +0x08  uint32  team_id            (0=blue, 1=orange)
//   +0x0C  uint32  bot_count          (1-3)
//   +0x10  uint32  difficulty         (0-4, BotDifficulty)
//   +0x14  uint32  loadout_id
//   +0x18  [12]    loadout_data
//   +0x24  uint32  spawn_position_seed
//   +0x28  uint32  reserved
//   +0x2C  uint32  reserved2
//
// Symbol: 0xa0687d9799640878
// Source: nakama server/evr/gameserver_spawn_bot.go
message SNSLobbySetSpawnBotOnServerMessage {
  // The lobby session to spawn bots in.
  string lobby_session_id = 1;
  // Team to spawn bots on (0=blue, 1=orange).
  uint32 team_id = 2;
  // Number of bots to spawn (1-3).
  uint32 bot_count = 3;
  // Bot difficulty level.
  BotDifficulty difficulty = 4;
  // Loadout preset ID.
  uint32 loadout_id = 5;
  // Additional loadout data.
  bytes loadout_data = 6;
  // RNG seed for spawn positions.
  uint32 spawn_position_seed = 7;
}
