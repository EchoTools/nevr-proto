/**
 * Friends system SNS messages.
 *
 * Source: echovr-reconstruction src/pnsrad/Social/CNSRADFriends.h,
 *         echovr-social-re-answers.md (rounds 1 and 2)
 *
 * The friends system is 100% SNS-message-based. CNSRADFriends (pnsrad.dll)
 * sends/receives these messages via CTcpBroadcaster. The game server
 * translates between protobuf (Nakama) and binary wire format (client).
 */
syntax = "proto3";

package gameservice.v1;

option csharp_namespace = "Nevr.Gameservice.V1";
option go_package = "buf.build/gen/go/echotools/nevr-api/protocolbuffers/go/gameservice/v1;gameservicev1";
option java_multiple_files = true;
option java_outer_classname = "FriendsProto";
option java_package = "com.echotools.nevr.gameservice.v1";

// Friend online status values.
// Source: echovr-social-re-answers round 1 Q5
enum SNSFriendStatus {
  // Friend is offline.
  SNS_FRIEND_STATUS_OFFLINE_UNSPECIFIED = 0;
  // Friend is busy (in-game).
  SNS_FRIEND_STATUS_BUSY = 1;
  // Friend is online (in menu/lobby).
  SNS_FRIEND_STATUS_ONLINE = 2;
  // Friend is no longer in list (removed/unknown).
  SNS_FRIEND_STATUS_NOT_IN_LIST = 3;
}

// Friend invite error codes.
// Source: echovr-social-re-answers round 2 Q16
enum SNSFriendInviteErrorCode {
  SNS_FRIEND_INVITE_ERROR_CODE_BAD_REQUEST_UNSPECIFIED = 0;
  SNS_FRIEND_INVITE_ERROR_CODE_NOT_FOUND = 1;
  SNS_FRIEND_INVITE_ERROR_CODE_SELF = 2;
  SNS_FRIEND_INVITE_ERROR_CODE_ALREADY = 3;
  SNS_FRIEND_INVITE_ERROR_CODE_PENDING = 4;
  SNS_FRIEND_INVITE_ERROR_CODE_FULL = 5;
}

// ============================================================================
// Friend Request Messages (client → server)
// ============================================================================

// Request the full friend list from the server.
//
// Binary wire: 0x20 fixed (routing_id + local_user_uuid + session_guid)
// Hash: 0xdcfa94680e8d19fc
// Sender: CNSRADFriends::Refresh()
// Source: echovr-social-re-answers round 1 Q6, Q7
message SNSFriendListRequestMessage {
  // Session login UUID of the requester.
  string login_session_id = 1;
}

// Sync friend state with server.
//
// Binary wire: 0x20 fixed (same format as ListRequest)
// Hash: 0xcdc02fd1dbee3aaa
// Sender: CNSRADFriends::Sync()
// Source: echovr-social-re-answers round 1 Q6, Q7
message SNSFriendSyncRequestMessage {
  // Session login UUID of the requester.
  string login_session_id = 1;
}

// Send a friend invite by user ID or name.
//
// Binary wire: 0x28 fixed (routing_id + uuid + session + target_user_id)
//   + optional variable (name string when inviting by name)
// Hash: 0x7f0d7a28de3c6f70 (shared with SNSPartySendInviteRequest)
// Sender: CNSRADFriends::Invite(UserAccountID) or Invite(char const*)
// Source: echovr-social-re-answers round 1 Q6, Q7
message SNSFriendInviteRequestMessage {
  // Session login UUID of the requester.
  string login_session_id = 1;
  // Target user ID (0 if inviting by name).
  uint64 target_user_id = 2;
  // Target user name (only set when inviting by name, empty otherwise).
  // Binary: variable data = null-terminated name string
  string target_name = 3;
}

// Accept a friend request.
//
// Binary wire: 0x28 fixed, routing_id = 0xFFFFFFFFFFFFFFFF
// Hash: 0x1bbcb7e810af4620 (shared with SNSPartyJoinRequest)
// Sender: CNSRADFriends::Accept(UserAccountID)
// Source: echovr-social-re-answers round 1 Q6, Q7
message SNSFriendAcceptRequestMessage {
  // Session login UUID of the requester.
  string login_session_id = 1;
  // User ID of the friend request sender to accept.
  uint64 target_user_id = 2;
}

// Reject a friend request.
//
// Binary wire: 0x28 fixed
// Hash: 0x78908988b7fe6db4 (shared with SNSPartyLeaveRequest)
// Sender: CNSRADFriends::Reject(UserAccountID)
// Source: echovr-social-re-answers round 1 Q6, Q7
message SNSFriendRejectRequestMessage {
  // Session login UUID of the requester.
  string login_session_id = 1;
  // User ID of the friend request sender to reject.
  uint64 target_user_id = 2;
}

// Cancel a sent friend invite.
//
// Binary wire: 0x28 fixed
// Hash: 0x78908988b7fe6db4 (shared with SNSPartyLeaveRequest)
// Sender: CNSRADFriends::Cancel(UserAccountID)
// Source: echovr-social-re-answers round 1 Q6, Q7
message SNSFriendCancelRequestMessage {
  // Session login UUID of the requester.
  string login_session_id = 1;
  // User ID of the invite target to cancel.
  uint64 target_user_id = 2;
}

// Remove a friend.
//
// Binary wire: 0x28 fixed
// Hash: 0x78908988b7fe6db4 (shared with SNSPartyLeaveRequest)
// Sender: CNSRADFriends::Remove(UserAccountID)
// Source: echovr-social-re-answers round 1 Q6, Q7
message SNSFriendRemoveRequestMessage {
  // Session login UUID of the requester.
  string login_session_id = 1;
  // User ID of the friend to remove.
  uint64 target_user_id = 2;
}

// ============================================================================
// Friend Response Messages (server → client)
// ============================================================================

// Full friend list response. Populates all three client-side lists.
//
// Binary wire: 0x14 fixed (5 × uint32 counts) +
//   ZStd-compressed variable (uint32 length prefix):
//     friend_ids[n_total] + friend_data[n_total] +
//     sent_ids[n_sent] + sent_data[n_sent] +
//     recv_ids[n_recv] + recv_data[n_recv] +
//     CStringTable (names for all entries)
//
// Handler: CNSRADFriends::ListResponseCB @ pnsrad.dll 0x180085400
// Source: echovr-social-re-answers round 1 Q4
message SNSFriendListResponseMessage {
  // Friends sorted by status: offline first, then busy, then online.
  // The client uses boundary counts to determine status per friend.
  uint32 offline_count = 1;
  uint32 busy_count = 2;
  uint32 online_count = 3;
  // Pending invite counts.
  uint32 sent_invite_count = 4;
  uint32 received_invite_count = 5;
  // Friend entries (ordered: offline, busy, online).
  repeated SNSFriendEntry friends = 6;
  // Sent friend invites.
  repeated SNSFriendEntry sent_invites = 7;
  // Received friend invites.
  repeated SNSFriendEntry received_invites = 8;
}

// A friend or invite entry.
// Source: echovr-social-re-answers round 1 Q4
message SNSFriendEntry {
  // Friend's user ID.
  // Binary: uint64 in friend_ids/sent_ids/recv_ids array
  uint64 user_id = 1;
  // Associated data field.
  // Binary: uint64 in friend_data/sent_data/recv_data array
  uint64 data = 2;
  // Display name.
  // Binary: entry in CStringTable
  string name = 3;
}

// Friend status change notification.
//
// Binary wire: 12 bytes fixed (friend_id uint64 + new_status uint32)
// Handler: CNSRADFriends::StatusNotifyCB @ pnsrad.dll 0x1800877c0
// Source: echovr-social-re-answers round 1 Q5
message SNSFriendStatusNotifyMessage {
  // The friend whose status changed.
  uint64 friend_id = 1;
  // New status value.
  SNSFriendStatus new_status = 2;
}

// Friend invite succeeded. Echoes back the invite target's info.
//
// Binary wire: 0x10 fixed (friend_id u64) + variable (friend_name string)
// Handler: CNSRADFriends::InviteSuccessCB @ pnsrad.dll 0x1800845b0
// Source: echovr-social-re-answers round 2 Q10
//
// Client adds/replaces entry in sent invites list.
message SNSFriendInviteSuccessMessage {
  // User ID of the invite target.
  uint64 friend_id = 1;
  // Display name of the invite target.
  string friend_name = 2;
}

// Friend invite failed.
//
// Binary wire: 0x11 fixed (friend_id u64 + error_code u8) + variable (friend_name)
// Handler: CNSRADFriends::InviteFailureCB @ pnsrad.dll 0x180083e10
// Source: echovr-social-re-answers round 2 Q16
//
// Error codes: 0=bad_request, 1=not_found, 2=self, 3=already, 4=pending, 5=full
message SNSFriendInviteFailureMessage {
  // User ID of the invite target.
  uint64 friend_id = 1;
  // Error code.
  SNSFriendInviteErrorCode error_code = 2;
  // Display name of the invite target.
  string friend_name = 3;
}

// Notification that someone sent you a friend invite.
//
// Binary wire: 0x10 fixed (friend_id u64) + variable (friend_name string)
// Handler: CNSRADFriends::InviteNotifyCB @ pnsrad.dll 0x180084200
// Source: echovr-social-re-answers round 2 Q11
//
// Client adds inviter to received invites list.
message SNSFriendInviteNotifyMessage {
  // User ID of the inviter.
  uint64 friend_id = 1;
  // Display name of the inviter.
  string friend_name = 2;
}

// Friend accept succeeded.
//
// Binary wire: 0x14 fixed (friend_id u64 + friend_type u32) + variable (friend_name)
// Handler: CNSRADFriends::AcceptSuccessCB @ pnsrad.dll 0x180080380
// Source: echovr-social-re-answers round 2 Q12
//
// Client calls AddFriend(friend_id, name, name_len, friend_type).
message SNSFriendAcceptSuccessMessage {
  // User ID of the accepted friend.
  uint64 friend_id = 1;
  // Friend type/classification.
  // Binary: u32 at payload+0x10
  uint32 friend_type = 2;
  // Display name of the accepted friend.
  string friend_name = 3;
}

// Friend accept failed.
//
// Binary wire: 0x11 fixed (friend_id u64 + error_code u8) + variable (friend_name)
// Handler: CNSRADFriends::AcceptFailureCB (Quest 0x2fe98c, 168 bytes)
// Source: echovr-social-re-answers round 2 Q17
//
// When error_code == 1: client calls RefreshFriendList.
message SNSFriendAcceptFailureMessage {
  // User ID of the friend.
  uint64 friend_id = 1;
  // Error code.
  // Binary: u8 at payload+0x10
  uint32 error_code = 2;
  // Display name of the friend.
  string friend_name = 3;
}

// Notification that someone accepted your friend invite.
//
// Binary wire: 0x14 fixed (friend_id u64 + friend_type u32), no string data
// Handler: CNSRADFriends::AcceptNotifyCB @ pnsrad.dll 0x180080220
// Source: echovr-social-re-answers round 2 Q13
//
// Client gets the friend's name from the LOCAL sent-invites CStringTable
// (not from the message). Then calls AddFriend and removes from sent invites.
message SNSFriendAcceptNotifyMessage {
  // User ID of the friend who accepted.
  uint64 friend_id = 1;
  // Friend type/classification.
  // Binary: u32 at payload+0x10
  uint32 friend_type = 2;
}

// Friend removal acknowledgment. No-op.
//
// Handler: CNSRADFriends::RemoveResponseCB (Quest 0x1feb80, 28 bytes — trivial)
// Source: echovr-social-re-answers round 2 Q14
message SNSFriendRemoveResponseMessage {}

// Notification that a friend removed you.
//
// Binary wire: 0x10 fixed (friend_id u64), no string data
// Handler: CNSRADFriends::RemoveNotifyCB @ pnsrad.dll 0x180086a70
// Source: echovr-social-re-answers round 2 Q15
//
// Client finds friend in list, copies name from local CStringTable,
// removes from friends array, adjusts group boundary counters.
message SNSFriendRemoveNotifyMessage {
  // User ID of the friend who removed you.
  uint64 friend_id = 1;
}

// Notification that someone rejected your friend invite.
//
// Binary wire: 0x10 fixed (friend_id u64), no string data
// Handler: CNSRADFriends::RejectNotifyCB @ pnsrad.dll 0x180086660
// Source: echovr-social-re-answers round 2 Q18
//
// Client finds friend in sent invites, copies name from local CStringTable,
// removes from sent invites array.
message SNSFriendRejectNotifyMessage {
  // User ID of the friend who rejected.
  uint64 friend_id = 1;
}

// Notification that someone withdrew their friend invite to you.
//
// Binary wire: 0x10 fixed (friend_id u64), no string data
// Handler: CNSRADFriends::WithdrawnNotifyCB @ pnsrad.dll 0x180088910
// Source: echovr-social-re-answers round 2 Q19
//
// Client finds friend in received invites, copies name from local CStringTable,
// removes from received invites array.
message SNSFriendWithdrawnNotifyMessage {
  // User ID of the friend who withdrew their invite.
  uint64 friend_id = 1;
}
