/**
 * Party system SNS messages.
 *
 * Source: echovr-reconstruction src/pnsrad/Social/CNSRADParty.h,
 *         echovr-social-re-answers.md (rounds 1 and 2)
 *
 * The party system is 100% SNS-message-based. CNSRADParty (pnsrad.dll)
 * sends/receives these messages via CTcpBroadcaster. The game server
 * translates between protobuf (Nakama) and binary wire format (client).
 *
 * Binary wire format details are in comments. The protobuf fields represent
 * the logical data; the game server handles packing/unpacking.
 */
syntax = "proto3";

package gameservice.v1;

option csharp_namespace = "Nevr.Gameservice.V1";
option go_package = "buf.build/gen/go/echotools/nevr-api/protocolbuffers/go/gameservice/v1;gameservicev1";
option java_multiple_files = true;
option java_outer_classname = "PartyProto";
option java_package = "com.echotools.nevr.gameservice.v1";

// Common error codes used by party failure messages.
// Source: echovr-social-re-answers round 2, Q1b/Q22
enum SNSPartyErrorCode {
  SNS_PARTY_ERROR_CODE_BAD_REQUEST_UNSPECIFIED = 0;
  SNS_PARTY_ERROR_CODE_INTERNAL = 1;
  SNS_PARTY_ERROR_CODE_NOT_FOUND = 2;
  // Used by LeaveFailure, UpdateMemberFailure:
  SNS_PARTY_ERROR_CODE_NOT_MEMBER = 3;
  SNS_PARTY_ERROR_CODE_NOT_OWNER = 4;
  // Used by JoinFailure (values 3-4 differ from leave):
  SNS_PARTY_ERROR_CODE_LOCKED = 5;
  SNS_PARTY_ERROR_CODE_FULL = 6;
}

// ============================================================================
// Party Request Messages (client → server)
// ============================================================================

// Create a new party.
//
// Binary wire: 0x28 fixed (SNSPartyPayload) + variable (party_json + member_json)
// Hash: 0x0b7bd21332523994 (shared with SNSPartyMemberUpdate)
// Sender: CNSRADParty::CreateInternal (pnsrad.dll)
// Source: echovr-social-re-answers round 1 Q9
message SNSPartyCreateRequestMessage {
  // Session login UUID of the requester.
  string login_session_id = 1;
  // Maximum number of party members.
  // Binary: (max_members - 1) & 0x07 in packed_field bits[2:0]
  uint32 max_members = 2;
  // Party-level JSON data (CJson::EncodeToCompact). May be empty.
  string party_json = 3;
  // Initial member JSON data for the creator. May be empty.
  string member_json = 4;
}

// Join an existing party.
//
// Binary wire: 0x28 fixed (SNSPartyPayload), routing_id = 0xFFFFFFFFFFFFFFFF
// Hash: 0x1bbcb7e810af4620 (shared with SNSFriendAcceptRequest)
// Sender: CNSRADParty::JoinInternal @ pnsrad.dll 0x18007fe50
// Source: CNSRADParty.h:25, SNSMessageTypes.h:1217
message SNSPartyJoinRequestMessage {
  // Session login UUID of the requester.
  string login_session_id = 1;
  // Party ID to join.
  uint64 party_id = 2;
}

// Leave the current party.
//
// Binary wire: 0x28 fixed (SNSPartyPayload)
// Hash: 0x78908988b7fe6db4 (shared with friend Cancel/Reject/Remove)
// Sender: CNSRADParty::LeaveInternal @ pnsrad.dll 0x180080610
// Source: CNSRADParty.h:26, SNSMessageTypes.h:1222
message SNSPartyLeaveRequestMessage {
  // Session login UUID of the requester.
  string login_session_id = 1;
}

// Kick a member from the party. Host only.
//
// Binary wire: 0x30 fixed (SNSPartyTargetPayload)
// Hash: 0xff02bf488e77bcba
// Sender: CNSRADParty::Kick @ pnsrad.dll 0x180080770
// Source: CNSRADParty.h:27, SNSMessageTypes.h:1226
message SNSPartyKickRequestMessage {
  // Session login UUID of the requester (must be host).
  string login_session_id = 1;
  // UUID of the member to kick.
  string target_user_uuid = 2;
  // Kick reason parameter.
  // Binary: SNSPartyTargetPayload.param at +0x28
  uint32 param = 3;
}

// Transfer party ownership to another member. Host only.
//
// Binary wire: 0x30 fixed (SNSPartyTargetPayload)
// Hash: 0x352f9d0e16001420
// Sender: CNSRADParty::Pass @ pnsrad.dll 0x180080880
// Source: CNSRADParty.h:28, SNSMessageTypes.h:1230
message SNSPartyPassOwnershipRequestMessage {
  // Session login UUID of the requester (must be host).
  string login_session_id = 1;
  // UUID of the member to transfer ownership to.
  string target_user_uuid = 2;
}

// Respond to a party invite (accept or reject).
//
// Binary wire: 0x30 fixed (SNSPartyTargetPayload)
// Hash: 0xeaf428c8a8a5cd2a
// Sender: CNSRADParty::RespondToInvite @ pnsrad.dll 0x180080990
// Source: CNSRADParty.h:29, SNSMessageTypes.h:1234
message SNSPartyRespondToInviteRequestMessage {
  // Session login UUID of the requester.
  string login_session_id = 1;
  // UUID of the invite sender.
  string target_user_uuid = 2;
  // Response parameter (accept/reject).
  // Binary: SNSPartyTargetPayload.param at +0x28
  uint32 param = 3;
}

// Send a party invite to another user.
//
// Binary wire: 0x28 fixed (SNSPartyPayload)
// Hash: 0x7f0d7a28de3c6f70 (shared with SNSFriendInviteRequest)
// Sender: CNSRADParty::SendInvite @ pnsrad.dll 0x180083cd0
// Source: CNSRADParty.h:31, SNSMessageTypes.h:1243
message SNSPartySendInviteRequestMessage {
  // Session login UUID of the requester.
  string login_session_id = 1;
  // User ID of the invite target.
  uint64 target_user_id = 2;
}

// Update party member data (shared state).
//
// Binary wire: 0x28 fixed + variable (serialized buffers with bitfield encoding)
// Hash: 0x0b7bd21332523994 (shared with SNSPartyCreateRequest)
// Sender: CNSRADParty::ShareData @ pnsrad.dll 0x180080b10
// Source: CNSRADParty.h:30, SNSMessageTypes.h:1238
message SNSPartyMemberUpdateMessage {
  // Session login UUID of the requester.
  string login_session_id = 1;
  // Raw variable data (game server passes through).
  bytes data = 2;
}

// Lock the party (prevent new joins). Host only.
//
// Binary wire: 0x28 fixed (SNSPartyPayload)
// Hash: derived at runtime from obfuscated string
// Sender: CNSRADParty::SetJoinableInternal(0) @ pnsrad.dll 0x180087070
// Source: CNSRADParty.h:33, SNSMessageTypes.h:1248
message SNSPartyLockRequestMessage {
  // Session login UUID of the requester (must be host).
  string login_session_id = 1;
}

// Unlock the party (allow new joins). Host only.
//
// Binary wire: 0x28 fixed (SNSPartyPayload)
// Hash: derived at runtime from "ZOlPrEfIxSNSPartyUnlockRequest"
// Sender: CNSRADParty::SetJoinableInternal(1) @ pnsrad.dll 0x180087070
// Source: CNSRADParty.h:33, SNSMessageTypes.h:1248
message SNSPartyUnlockRequestMessage {
  // Session login UUID of the requester (must be host).
  string login_session_id = 1;
}

// ============================================================================
// Party Response Messages (server → client)
// ============================================================================

// Party creation succeeded.
//
// Binary wire: 8 bytes fixed at STcpMsg+0x08 (party_id only)
// Handler: CNSRADParty::CreateSuccessCB @ pnsrad.dll 0x180080dc0
// Source: echovr-social-re-answers round 1 Q1
message SNSPartyCreateSuccessMessage {
  // Server-assigned party ID.
  uint64 party_id = 1;
}

// Party creation failed.
//
// Handler: CNSRADParty::CreateFailureCB
// Source: echovr-social-re-answers round 2 (not directly asked, but follows
//   same error pattern as LeaveFailure/JoinFailure)
message SNSPartyCreateFailureMessage {
  // Party ID (if applicable).
  uint64 party_id = 1;
  // Error code.
  SNSPartyErrorCode error_code = 2;
}

// Successfully joined a party. Contains full party state.
//
// Binary wire: fixed (party_id + owner_id + packed_flags) +
//   ZStd-compressed variable (member IDs + party JSON + CStringTable)
// Handler: CNSRADParty::JoinSuccessCB @ pnsrad.dll 0x180084aa0
// Source: echovr-social-re-answers round 1 Q2
message SNSPartyJoinSuccessMessage {
  // Party ID.
  uint64 party_id = 1;
  // Host/owner user ID.
  uint64 owner_id = 2;
  // Maximum number of members.
  // Binary: packed_flags bits[2:0] (& 0x07)
  uint32 max_members = 3;
  // Whether the party is locked.
  // Binary: packed_flags bit[15]
  bool locked = 4;
  // Party-level JSON data.
  // Binary: party_json_size in packed_flags bits[14:6], data in variable payload
  string party_json = 5;
  // Current party members.
  repeated SNSPartyMember members = 6;
}

// A party member entry within JoinSuccess.
// Source: echovr-social-re-answers round 1 Q2
message SNSPartyMember {
  // Member's user ID.
  // Binary: uint64 in member_ids array
  uint64 user_id = 1;
  // Member's display name.
  // Binary: null-terminated string in CStringTable, max 35 chars (0x24 bytes)
  string name = 2;
  // Member's per-member JSON data.
  // Binary: CJson encoded in CStringTable
  string member_json = 3;
}

// Party join failed.
//
// Binary wire: party_id (u64) + error_code (u8) at STcpMsg+0x08
// Handler: CNSRADParty::JoinFailureCB @ pnsrad.dll 0x180084740
// Source: echovr-social-re-answers round 2 Q22
//
// Error codes: 0=bad_request, 1=internal, 2=not_found, 3=locked, 4=full
message SNSPartyJoinFailureMessage {
  // Party ID.
  uint64 party_id = 1;
  // Error code. Join-specific values: 3=locked, 4=full.
  // Binary: u8 at payload+0x10, switch at 0x180084740
  SNSPartyErrorCode error_code = 2;
}

// Notification to existing party members that a new member joined.
//
// Binary wire: 16 bytes fixed (party_id + member_id) +
//   variable (member_name\0 + member_json, not compressed)
// Handler: CNSRADParty::JoinNotifyCB @ pnsrad.dll 0x180084980
// Source: echovr-social-re-answers round 1 Q3
message SNSPartyJoinNotifyMessage {
  // Party ID (handler validates this matches current party).
  uint64 party_id = 1;
  // New member's user ID.
  uint64 member_id = 2;
  // New member's display name.
  string member_name = 3;
  // New member's per-member JSON data.
  string member_json = 4;
}

// Leave succeeded. No-op acknowledgment.
//
// Handler: CNSRADParty::LeaveSuccessCB (Quest 0x20166c, 28 bytes — trivial)
// Source: echovr-social-re-answers round 2 Q1
message SNSPartyLeaveSuccessMessage {}

// Leave failed.
//
// Binary wire: party_id (u64) + error_code (u8) at STcpMsg+0x08
// Handler: CNSRADParty::LeaveFailureCB @ pnsrad.dll 0x1800851a0
// Source: echovr-social-re-answers round 2 Q1b
//
// Error codes: 0=bad_request, 1=internal, 2=not_found, 3=not_member, 4=not_owner
message SNSPartyLeaveFailureMessage {
  // Party ID.
  uint64 party_id = 1;
  // Error code.
  // Binary: u8 at payload+0x10, switch at 0x1800851a0
  SNSPartyErrorCode error_code = 2;
}

// Notification that a member left the party.
//
// Binary wire: 0x18 fixed (party_id + member_id), no variable data
// Handler: CNSRADParty::LeaveNotifyCB @ pnsrad.dll 0x180085300
// Source: echovr-social-re-answers round 2 Q2
message SNSPartyLeaveNotifyMessage {
  // Party ID (handler validates match).
  uint64 party_id = 1;
  // User ID of the member who left.
  uint64 member_id = 2;
}

// Kick succeeded.
//
// Binary wire: 0x18 fixed (party_id + kick_id)
// Handler: CNSRADParty::KickSuccessCB @ pnsrad.dll 0x180085170
// Source: echovr-social-re-answers round 2 Q3
message SNSPartyKickSuccessMessage {
  // Party ID.
  uint64 party_id = 1;
  // User ID of the kicked member.
  uint64 kick_id = 2;
}

// Kick notification. Sent to ALL party members (including the kicked one).
//
// Binary wire: 0x18 fixed (party_id + kick_id)
// Handler: CNSRADParty::KickNotifyCB @ pnsrad.dll 0x180085040
// Source: echovr-social-re-answers round 2 Q4
//
// If kick_id == self: client destroys party and re-creates (reset state).
// If kick_id != self: client removes kicked member from local list.
message SNSPartyKickNotifyMessage {
  // Party ID (handler validates match).
  uint64 party_id = 1;
  // User ID of the kicked member.
  uint64 kick_id = 2;
}

// Ownership transfer succeeded.
//
// Binary wire: 0x18 fixed (party_id + pass_id)
// Handler: CNSRADParty::PassSuccessCB @ pnsrad.dll 0x180085f80
// Source: echovr-social-re-answers round 2 Q5
message SNSPartyPassSuccessMessage {
  // Party ID.
  uint64 party_id = 1;
  // User ID of the new owner.
  uint64 pass_id = 2;
}

// Ownership transfer notification. Sent to all party members.
//
// Binary wire: 0x18 fixed (party_id + pass_id)
// Handler: CNSRADParty::PassNotifyCB @ pnsrad.dll 0x180085ef0
// Source: echovr-social-re-answers round 2 Q6
//
// Client updates owner_id at this+0x2f0 to pass_id.
message SNSPartyPassNotifyMessage {
  // Party ID (handler validates match).
  uint64 party_id = 1;
  // User ID of the new owner.
  uint64 pass_id = 2;
}

// Invite delivery acknowledgment. No-op.
//
// Handler: CNSRADParty::InviteResponseCB (Quest 0x202210, 28 bytes — trivial)
// Source: echovr-social-re-answers round 2 Q7
message SNSPartyInviteResponseMessage {}

// Notification that a party invite was received.
//
// Binary wire: 0x20 fixed (time + party_id + sender_id) + variable (sender_name)
// Handler: CNSRADParty::InviteNotifyCB @ pnsrad.dll 0x180084350
// Source: echovr-social-re-answers round 2 Q8
message SNSPartyInviteNotifyMessage {
  // Timestamp of the invite.
  // Binary: i64 at payload+0x08
  int64 time = 1;
  // Party ID of the inviting party.
  // Binary: u64 at payload+0x10
  uint64 party_id = 2;
  // User ID of the invite sender.
  // Binary: u64 at payload+0x18
  uint64 sender_id = 3;
  // Display name of the invite sender.
  // Binary: variable string data at msg+0x10
  string sender_name = 4;
}

// Full invite list response (all pending invites).
//
// Binary wire: 0x0C fixed (n_invites u32) + variable (3 × u64 arrays + CStringTable)
// Handler: CNSRADParty::InviteListResponseCB @ pnsrad.dll 0x180083f10
// Source: echovr-social-re-answers round 2 Q9
message SNSPartyInviteListResponseMessage {
  // Pending invite entries.
  repeated SNSPartyInviteEntry invites = 1;
}

// A single invite entry within InviteListResponse.
// Source: echovr-social-re-answers round 2 Q9
message SNSPartyInviteEntry {
  // Timestamp of the invite.
  // Binary: i64 in times array (section 0)
  int64 time = 1;
  // Party ID of the inviting party.
  // Binary: u64 in party_ids array (section 1)
  uint64 party_id = 2;
  // User ID of the invite sender.
  // Binary: u64 in sender_ids array (section 2)
  uint64 sender_id = 3;
  // Display name of the invite sender.
  // Binary: entry in CStringTable (section 3)
  string sender_name = 4;
}

// Party data updated. No-op acknowledgment.
//
// Handler: CNSRADParty::UpdateSuccessCB (Quest 0x201794, 28 bytes — trivial)
// Source: echovr-social-re-answers round 2 Q20
message SNSPartyUpdateSuccessMessage {}

// Notification that party data changed.
//
// Binary wire: 0x10 fixed (party_id) + variable JSON blob
// Handler: CNSRADParty::UpdateNotifyCB @ pnsrad.dll 0x180087ed0
// Source: echovr-social-re-answers round 2 Q20
//
// Client decodes JSON into CJson at this+0x230 (party_json).
// If lobby_id changes: fires lobby joined/left delegate.
message SNSPartyUpdateNotifyMessage {
  // Party ID (handler validates match).
  uint64 party_id = 1;
  // Updated party JSON data.
  // Binary: variable string data decoded via CJson::DecodeFrom
  string party_json = 2;
}

// Member data update succeeded. Logs only.
//
// Binary wire: member_id (u64) + party_id (u64) at STcpMsg+0x08
// Handler: CNSRADParty::UpdateMemberSuccessCB @ pnsrad.dll 0x180087ea0
// Source: echovr-social-re-answers round 2 Q20
message SNSPartyUpdateMemberSuccessMessage {
  // Member whose data was updated.
  uint64 member_id = 1;
  // Party ID.
  uint64 party_id = 2;
}

// Member data update failed.
//
// Binary wire: party_id (u64) + error_code (u8) at STcpMsg+0x08
// Handler: CNSRADParty::UpdateMemberFailureCB @ pnsrad.dll 0x180087d40
// Source: echovr-social-re-answers round 2 Q20
message SNSPartyUpdateMemberFailureMessage {
  // Party ID.
  uint64 party_id = 1;
  // Error code (same set as LeaveFailure).
  SNSPartyErrorCode error_code = 2;
}

// Notification that a member's data changed.
//
// Binary wire: 0x18 fixed (party_id + member_id) + variable JSON blob
// Handler: CNSRADParty::UpdateMemberNotifyCB @ pnsrad.dll 0x180087dc0
// Source: echovr-social-re-answers round 2 Q20
//
// Client finds member by member_id, decodes JSON into their CJson at
// this+0x280 + member_index * 0x10.
message SNSPartyUpdateMemberNotifyMessage {
  // Party ID (handler validates match).
  uint64 party_id = 1;
  // User ID of the updated member.
  uint64 member_id = 2;
  // Updated member JSON data.
  // Binary: variable string data decoded via CJson::DecodeFrom
  string member_json = 3;
}

// Lock succeeded. No-op acknowledgment.
//
// Handler: CNSRADParty::LockSuccessCB (Quest 0x201b44, 28 bytes — trivial)
// Source: echovr-social-re-answers round 2 Q21
message SNSPartyLockSuccessMessage {}

// Lock failed.
//
// Binary wire: party_id (u64) at STcpMsg+0x08
// Handler: CNSRADParty::LockFailureCB @ pnsrad.dll 0x180085a90
// Source: echovr-social-re-answers round 2 Q21
message SNSPartyLockFailureMessage {
  // Party ID.
  uint64 party_id = 1;
}

// Lock notification. Sent to all party members.
//
// Binary wire: 0x10 fixed (party_id only)
// Handler: CNSRADParty::LockNotifyCB @ pnsrad.dll 0x180085ac0
// Source: echovr-social-re-answers round 2 Q21
//
// Client sets dirty_flags |= 0x10 (locked bit).
message SNSPartyLockNotifyMessage {
  // Party ID (handler validates match).
  uint64 party_id = 1;
}

// Unlock succeeded. No-op acknowledgment.
//
// Handler: CNSRADParty::UnlockSuccessCB (Quest 0x201bf4, 28 bytes — trivial)
// Source: echovr-social-re-answers round 2 Q21
message SNSPartyUnlockSuccessMessage {}

// Unlock notification. Sent to all party members.
//
// Binary wire: 0x10 fixed (party_id only)
// Handler: CNSRADParty::UnlockNotifyCB @ pnsrad.dll 0x180087b50
// Source: echovr-social-re-answers round 2 Q21
//
// Client clears dirty_flags &= ~0x10 (locked bit).
message SNSPartyUnlockNotifyMessage {
  // Party ID (handler validates match).
  uint64 party_id = 1;
}
